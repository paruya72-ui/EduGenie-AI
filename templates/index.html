<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EduGenie - AI Learning Assistant</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >
</head>

<body>

    <div class="app-container">

        <!-- Header -->
        <header class="header">
            <div>
                <h1>EduGenie</h1>
                <p>AI-Powered Learning Assistant</p>
            </div>

            <div class="status">
                <span class="status-dot"></span>
                AI Ready
            </div>
        </header>


        <!-- Main Content -->
        <main class="main-content">

            <!-- Task Selection -->
            <section class="card">

                <h2>What do you want to learn?</h2>

                <p class="description">
                    Choose a learning task and let EduGenie
                    help you understand the topic.
                </p>


                <label for="task">
                    Select Task
                </label>

                <select id="task">

                    <option value="qa">
                        Question & Answer
                    </option>

                    <option value="explain">
                        Explain a Concept
                    </option>

                    <option value="quiz">
                        Generate Quiz
                    </option>

                    <option value="summarize">
                        Summarize Text
                    </option>

                    <option value="learning">
                        Learning Recommendations
                    </option>

                </select>


                <!-- Dynamic Input Area -->
                <div id="input-area">

                    <label for="user-input">
                        Enter your question
                    </label>

                    <textarea
                        id="user-input"
                        placeholder="Example: What is HTML?"
                        rows="7"
                    ></textarea>

                </div>


                <!-- Level -->
                <div
                    id="level-container"
                    class="hidden"
                >

                    <label for="level">
                        Your Level
                    </label>

                    <select id="level">

                        <option value="beginner">
                            Beginner
                        </option>

                        <option value="intermediate">
                            Intermediate
                        </option>

                        <option value="advanced">
                            Advanced
                        </option>

                    </select>

                </div>


                <!-- Goal -->
                <div
                    id="goal-container"
                    class="hidden"
                >

                    <label for="goal">
                        Learning Goal
                    </label>

                    <input
                        type="text"
                        id="goal"
                        placeholder="Example: Become a full-stack developer"
                    >

                </div>


                <!-- Submit Button -->
                <button
                    id="submit-button"
                    type="button"
                >
                    <span id="button-text">
                        Generate Answer
                    </span>

                    <span
                        id="loading"
                        class="hidden"
                    >
                        Processing...
                    </span>
                </button>

            </section>


            <!-- Result -->
            <section
                id="result-card"
                class="card result-card hidden"
            >

                <div class="result-header">

                    <h2>Result</h2>

                    <button
                        id="clear-button"
                        type="button"
                    >
                        Clear
                    </button>

                </div>


                <div id="result">
                    Your result will appear here.
                </div>

            </section>

        </main>


        <!-- Footer -->
        <footer class="footer">

            <p>
                EduGenie &copy; 2026
            </p>

            <p>
                Powered by FastAPI & Gemini
            </p>

        </footer>

    </div>


    <script src="/static/app.js"></script>

</body>
</html>
